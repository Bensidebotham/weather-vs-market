name: ingest
on:
  schedule:
    # Backup only. The main trigger is a launchd job on the maintainer's Mac that
    # dispatches this workflow shortly before each city's lead times (GitHub runs
    # scheduled workflows hours late). Few runs keep Neon's free tier mostly asleep.
    - cron: "37 3,11,14,18 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
concurrency:
  group: ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run wvm settle
      # Fails the job (and emails the repo owner) if no markets were found.
      - run: uv run wvm ingest
      # The dashboard reads the newest published document from the database,
      # so no commit or redeploy is needed for fresh data.
      - if: always()
        run: uv run wvm publish
      - name: Report failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/report-failure.sh
