name: ingest
on:
  schedule:
    # Twice an hour, off the top of the hour. GitHub throttles scheduled runs (an
    # hourly cron fired only 3-7 times a day in Oct 2026), so ask more often. Every
    # 15 min would keep Neon's free-tier compute awake past its 100 CU-hour budget.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run wvm settle
      # Fails the job (and emails the repo owner) if no markets were found.
      - run: uv run wvm ingest
      # The dashboard reads the newest published document from the database,
      # so no commit or redeploy is needed for fresh data.
      - if: always()
        run: uv run wvm publish
